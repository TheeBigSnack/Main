# Lot Sync: the Supabase CLI's project file (Milestone 4). Minimal on purpose;
# `supabase init` would write a much longer one and every value left out here
# keeps the CLI's default. The owner links it to their project once with
# `supabase link --project-ref <ref>`; nothing secret lives here.

project_id = "lot-sync"

[api]
enabled = true
# Only the public schema is exposed through the API. Row-level security
# (migrations/0002_rls.sql) decides what a signed-in member gets from it.
schemas = ["public"]

[db]
# Match the project's Postgres version (Dashboard: Project settings, Infrastructure).
# The views in 0003_views.sql need 15 or newer (security_invoker).
major_version = 17

[auth]
enabled = true
# Magic links only: no passwords anywhere in Lot Sync.
enable_signup = true
# Where the sign-in email may send people. Local stack only: on the hosted
# project this is Authentication, URL configuration, and there the Site URL
# and the one redirect URL are the manager page's own address (README step
# 3). Never leave a hosted project on a localhost Site URL: a manager's
# magic link would go to whatever listens on that port of their computer.
# The extension needs no redirect: it signs in with the emailed code.
site_url = "http://127.0.0.1:8787/"
additional_redirect_urls = ["http://127.0.0.1:8787/"]

# Anyone holding the public anon key can ask for sign-in emails; keep the
# budget small (README step 3). The hosted project's limits live in the
# Dashboard, Authentication, Rate limits; these are the local stack's.
[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
enable_confirmations = false

# The sign-in emails in Lot Sync's own words (templates/). While
# enable_confirmations is false every sign-in sends magic_link, a person's
# first one included; confirmation goes only to an address that has never
# signed in, and only while confirmations are on (a new hosted project's
# default), so both carry the code and the link. The paths start at the
# folder that holds supabase/, as the CLI reads them. otp_length and
# otp_expiry stay at the CLI's defaults, 6 digits and 3600 seconds: the
# extension's code box takes six digits and the emails say one hour
# (test/emailTemplates.test.js). The hosted project needs the templates
# pasted in (README, "Sign-in emails").
[auth.email.template.magic_link]
subject = "Your Lot Sync sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your Lot Sync sign-in code"
content_path = "./supabase/templates/confirmation.html"

# The two Edge Functions check the caller's token themselves (a bad token gets
# a plain 401 with a message the extension shows), so the gateway's own check
# is off. That also lets the browser's CORS preflight through, which carries
# no token.
[functions.rewrite]
verify_jwt = false

[functions.sync]
verify_jwt = false

# Stripe's webhook carries no Supabase token either; the function checks the
# Stripe-Signature header itself (functions/billing/index.ts).
[functions.billing]
verify_jwt = false

# The landing page's visitors are anonymous: the lead function checks the
# page's Origin against LEAD_ORIGINS, a honeypot and its own rate limits
# instead of a token (functions/lead/index.ts).
[functions.lead]
verify_jwt = false
