<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Used 2021 Toyota Tacoma SR5 | Sample Motors</title>
<!-- the offer has no price of its own: a crossed-out list price first, then
     the sale price, as Google's merchant listing documentation shows it. The
     page crosses the old price out with a class, which a plain read cannot see. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Car",
  "name": "Used 2021 Toyota Tacoma SR5",
  "vehicleIdentificationNumber": "5TDSAMPLXMS000121",
  "vehicleModelDate": "2021",
  "brand": { "@type": "Brand", "name": "Toyota" },
  "model": "Tacoma",
  "vehicleConfiguration": "SR5",
  "itemCondition": "https://schema.org/UsedCondition",
  "mileageFromOdometer": { "@type": "QuantitativeValue", "value": 33871, "unitCode": "SMI" },
  "image": "/photos/tacoma-1.jpg",
  "offers": {
    "@type": "Offer",
    "availability": "https://schema.org/InStock",
    "priceSpecification": [
      { "@type": "UnitPriceSpecification", "priceType": "https://schema.org/StrikethroughPrice", "price": 32995, "priceCurrency": "USD" },
      { "@type": "UnitPriceSpecification", "price": 29995, "priceCurrency": "USD" }
    ]
  }
}
</script>
</head>
<body>
<h1>Used 2021 Toyota Tacoma SR5</h1>
<p class="price"><span class="price-old">$32,995</span> <span class="price-now">$29,995</span></p>
<p>33,871 miles</p>
</body>
</html>
