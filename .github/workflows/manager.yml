# Deploys the manager view (manager/) to Cloudflare Pages, where it answers
# at the address the owner gives it (docs/production-setup.md recommends
# app.<the product's domain>). Runs by hand (Actions, Manager view, Run
# workflow) and on a push to the repository's default branch that touches
# the page or its config; work branches never deploy.
#
# Until the owner has added the two Cloudflare secrets the job says so and
# stops green, so pushes before the account exists stay quiet. With them it
# refuses to deploy a page that is not configured for the production project
# (npm run set-project -- --check), runs the page's tests, and uploads the
# folder without the local demo server.
#
# Settings it reads, on the "manager-view" environment (Settings,
# Environments, manager-view, deployment branches: the default branch only),
# so a workflow on another branch cannot read them:
#   secrets  CLOUDFLARE_API_TOKEN   an API token with Cloudflare Pages: Edit only
#            CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's id (not secret, kept with the token)
#   variable CLOUDFLARE_PAGES_PROJECT  the Pages project's name (default lotcurrent-app)
#   variable MANAGER_URL      the page's own address once its DNS is set (https://app.<domain>/)
#   variable SENDER_DOMAIN    the sign-in email's sending domain once it is set (mail.<domain>)
#
# Every deploy ends with npm run check-hosting against the project's
# <project>.pages.dev address, and against MANAGER_URL and SENDER_DOMAIN when
# they are set. "Check only" runs that check without deploying (run it from
# the default branch: other branches are skipped). Before the first deploy the
# pages.dev line fails on a check-only run that has the Cloudflare secrets.
name: Manager view

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Check the hosted page and the DNS records without deploying
        type: boolean
        default: false
  push:
    paths:
      - manager/**
      - extension/src/accountConfig.js
      - scripts/set-project.mjs
      - scripts/check-deploy.mjs
      - scripts/check-hosting.mjs
      - test/checkHosting.test.js
      - .github/workflows/manager.yml

# Nothing here writes to the repository; the upload uses Cloudflare's token.
permissions:
  contents: read

concurrency:
  group: manager-view
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: manager-view
    # The Cloudflare secrets are not here: only the deploy step gets them, so
    # the actions that set up the runner, the page's tests and the hosting
    # check never see them. The first step learns only whether they are set.
    env:
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'lotcurrent-app' }}
      MANAGER_URL: ${{ vars.MANAGER_URL }}
      SENDER_DOMAIN: ${{ vars.SENDER_DOMAIN }}
      CHECK_ONLY: ${{ inputs.check_only == true }}
    steps:
      - name: Is Cloudflare set up?
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: nothing deployed (docs/production-setup.md, step 6)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true' || env.CHECK_ONLY == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true' || env.CHECK_ONLY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: The page names the production project with a pinned client
        if: steps.ready.outputs.go == 'true' && env.CHECK_ONLY != 'true'
        run: node scripts/set-project.mjs --check
      - name: The page's tests
        if: steps.ready.outputs.go == 'true' && env.CHECK_ONLY != 'true'
        run: node --test test/manager.test.js test/setProject.test.js test/productionSetup.test.js test/checkHosting.test.js
      - name: Stage the folder without the local demo server
        if: steps.ready.outputs.go == 'true' && env.CHECK_ONLY != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/manager"
          rsync -a --exclude serve.mjs manager/ "$RUNNER_TEMP/manager/"
          ls -la "$RUNNER_TEMP/manager"
      # An exact wrangler, so a new release cannot change the deploy under us.
      # The project is created on the first run; with a wrong token or account id the create fails and says why.
      - name: Deploy to Cloudflare Pages
        if: steps.ready.outputs.go == 'true' && env.CHECK_ONLY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.145.0 pages project list | grep -Fq " $PAGES_PROJECT "; then
            echo "the project $PAGES_PROJECT exists"
          else
            npx --yes wrangler@4.145.0 pages project create "$PAGES_PROJECT" --production-branch main
          fi
          npx --yes wrangler@4.145.0 pages deploy "$RUNNER_TEMP/manager" --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
      # A first deploy can take a minute before its address answers, so after
      # a deploy the pages.dev check gets a few tries. The page's own address
      # and the sender's DNS are checked once, when their variables are set.
      # With "check only" and no Cloudflare secrets yet, only the variables'
      # addresses are checked (the sender's DNS can be set up first).
      - name: Check the hosted page and the DNS records
        if: steps.ready.outputs.go == 'true' || env.CHECK_ONLY == 'true'
        env:
          DEPLOYED: ${{ steps.ready.outputs.go }}
        run: |
          status=0
          if [ "$DEPLOYED" = true ]; then
            pages=(--app "https://$PAGES_PROJECT.pages.dev/" --pages "$PAGES_PROJECT")
            tries=1
            if [ "$CHECK_ONLY" != true ]; then tries=5; fi
            status=1
            for i in $(seq "$tries"); do
              if [ "$i" -gt 1 ]; then sleep 15; fi
              if node scripts/check-hosting.mjs "${pages[@]}"; then status=0; break; fi
            done
          fi
          more=()
          if [ -n "$MANAGER_URL" ]; then more+=(--app "$MANAGER_URL" --pages "$PAGES_PROJECT"); fi
          if [ -n "$SENDER_DOMAIN" ]; then more+=(--sender "$SENDER_DOMAIN"); fi
          if [ "${#more[@]}" -gt 0 ]; then
            node scripts/check-hosting.mjs "${more[@]}" || status=1
          elif [ "$DEPLOYED" != true ]; then
            echo "::notice::nothing to check: set MANAGER_URL or SENDER_DOMAIN on the manager-view environment (docs/production-setup.md, steps 5 and 6)"
          fi
          exit "$status"
