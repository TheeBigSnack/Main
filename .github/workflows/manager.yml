# Deploys the manager view (manager/) to Cloudflare Pages, where it answers
# at the address the owner gives it (docs/production-setup.md recommends
# app.<the product's domain>). Runs by hand (Actions, Manager view, Run
# workflow) and on a push to the repository's default branch that touches
# the page or its config; work branches never deploy.
#
# Until the owner has added the two Cloudflare secrets the job says so and
# stops green, so pushes before the account exists stay quiet. With them it
# refuses to deploy a page that is not configured for the production project
# (npm run set-project -- --check), runs the page's tests, and uploads the
# folder without the local demo server.
#
# Settings it reads, on the "manager-view" environment (Settings,
# Environments, manager-view, deployment branches: the default branch only),
# so a workflow on another branch cannot read them:
#   secrets  CLOUDFLARE_API_TOKEN   an API token with Cloudflare Pages: Edit only
#            CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's id (not secret, kept with the token)
#   variable CLOUDFLARE_PAGES_PROJECT  the Pages project's name (default lotcurrent-app)
name: Manager view

on:
  workflow_dispatch:
  push:
    paths:
      - manager/**
      - extension/src/accountConfig.js
      - scripts/set-project.mjs
      - scripts/check-deploy.mjs
      - .github/workflows/manager.yml

# Nothing here writes to the repository; the upload uses Cloudflare's token.
permissions:
  contents: read

concurrency:
  group: manager-view
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: manager-view
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'lotcurrent-app' }}
    steps:
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: nothing deployed (docs/production-setup.md, step 5)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: The page names the production project with a pinned client
        if: steps.ready.outputs.go == 'true'
        run: node scripts/set-project.mjs --check
      - name: The page's tests
        if: steps.ready.outputs.go == 'true'
        run: node --test test/manager.test.js test/setProject.test.js test/productionSetup.test.js
      - name: Stage the folder without the local demo server
        if: steps.ready.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/manager"
          rsync -a --exclude serve.mjs manager/ "$RUNNER_TEMP/manager/"
          ls -la "$RUNNER_TEMP/manager"
      # An exact wrangler, so a new release cannot change the deploy under us.
      # The project is created on the first run; with a wrong token or account id the create fails and says why.
      - name: Deploy to Cloudflare Pages
        if: steps.ready.outputs.go == 'true'
        run: |
          if npx --yes wrangler@4.145.0 pages project list | grep -Fq " $PAGES_PROJECT "; then
            echo "the project $PAGES_PROJECT exists"
          else
            npx --yes wrangler@4.145.0 pages project create "$PAGES_PROJECT" --production-branch main
          fi
          npx --yes wrangler@4.145.0 pages deploy "$RUNNER_TEMP/manager" --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
