# Deploys the website (site/) to GitHub Pages at https://lotcurrent.com: on
# every push to the repository's default branch and by hand (Actions, Pages,
# Run workflow, on the default branch). Pages is set to the GitHub Actions
# source with the custom domain and Enforce HTTPS (docs/website.md). The
# default branch is read from the repository, never written here, so renaming
# it needs no change; a push to any other branch starts the workflow and the
# job is skipped. Nothing is built: site/ is committed as served, and the two
# --check runs refuse the deploy when a committed page differs from what its
# generator would write (someone edited an output by hand, or changed
# site/config.js, a fragment or a legal text without rerunning it). Then the
# unit tests, the same npm test CI's unit job runs, refuse it when any rule
# fails: the honesty rules over every page, site/pricing.json equal to the
# pricing Stripe is set up from, and the rest. This workflow does not wait
# for CI, so without them a push that turns CI red would already be live.
name: Pages

on:
  push:
  workflow_dispatch:

# The deploy reads the checkout and asks GitHub's OIDC provider for the
# token that deploy-pages needs; nothing writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a running one finishes: Pages does not take a
# cancelled deploy well. Runs on other branches (skipped) get a group of their
# own, so they never queue behind a deploy or push a waiting one out.
concurrency:
  group: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # All three need only Node: no npm ci, no browser (npm test takes about ten seconds).
      - run: node scripts/site-pages.mjs --check
      - run: node scripts/legal-pages.mjs --check
      - run: npm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
