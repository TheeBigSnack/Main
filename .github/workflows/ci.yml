# Lot Sync CI: the unit tests, then each end-to-end flow in its own job.
# The e2e flows load the real extension into Playwright's Chromium against
# the two mock servers in test/e2e/ (never facebook.com); one flow per job
# because the queue flow has 60-second waits that time out when two
# Chromiums compete for one runner (see HANDOFF.md section 3.4).
name: CI

on:
  push:
  pull_request:

# The jobs only read the checkout and upload their own artifacts; no job
# needs to write to the repository, so the token gets nothing more.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flow: [popup, post, queue, wizard, upkeep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:${{ matrix.flow }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.flow }}
          path: test/e2e/screenshots/
          if-no-files-found: ignore

  demo:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node demo/drive.mjs
      - run: npm run test:a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-demo
          path: demo/screenshots/
          if-no-files-found: ignore

  # The Supabase SQL checks (supabase/tests/*.sql) against a plain Postgres 16:
  # every migration applied in order, then each test file, each of which must
  # leave the database as it found it (the script checks). concurrency.sql runs
  # two real sessions through dblink, which the postgres:16 image ships; they
  # connect back over the container's own unix socket as the superuser.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/sql-test.mjs

  pack:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
