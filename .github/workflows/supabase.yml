# Deploys the database and the Edge Functions to the production Supabase
# project, by hand only (Actions, Supabase, Run workflow): nothing here runs
# on a push. docs/production-setup.md, step 3, says when to run each step.
#
#   plan       links the project and shows which migrations db push would
#              apply (supabase db push --dry-run); changes nothing
#   database   applies them (supabase db push)
#   functions  deploys the functions named in the second box (default:
#              all four, rewrite sync billing lead), and refuses while db
#              push would still apply a migration: run database first
#   verify     compares production with the repository and changes
#              nothing: the migrations it has recorded (migration list and
#              db push --dry-run), its public schema against the one the
#              migrations build (db diff), and each deployed function's
#              source against supabase/functions (functions download, then
#              git diff). Run it before the first deploy from here and after
#              anything was changed by hand (docs/production-setup.md, step 3)
#   check      only the outside check (npm run check-deploy)
#
# Every step ends with npm run check-deploy against the project the
# committed config files name (only functions, verify and check fail on it;
# before the functions exist some of its lines fail by design), and refuses to start when those files name a
# different project from SUPABASE_PROJECT_REF, so a deploy can only reach the
# project the extension and the manager view talk to.
#
# Settings it reads, all on the "production" environment (Settings,
# Environments, production). docs/production-setup.md, step 2, has the owner
# limit that environment to the default branch (once that is set, a workflow
# on another branch cannot read them) and add himself under Required
# reviewers. Only that second setting makes a run wait for his approval:
# without it nothing pauses, and a run starts the moment anyone who can
# dispatch it does. The approval is meant to be his own click: a session
# working with his GitHub access could approve a run through GitHub's API
# too, and leaves that to him.
# The settings:
#   secrets  SUPABASE_ACCESS_TOKEN  a personal access token (supabase.com, Account, Access tokens)
#            SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   variable SUPABASE_PROJECT_REF   the 20-character ref in the project URL (not secret)
#   variable MANAGER_URL            optional: the manager view's address, as on manager-view;
#                                   check-deploy then checks that page may call billing (ALLOWED_ORIGINS)
name: Supabase

on:
  workflow_dispatch:
    inputs:
      step:
        description: What to do
        type: choice
        options: [plan, database, functions, verify, check]
        default: plan
      functions:
        description: Functions to deploy (functions step only)
        type: string
        default: rewrite sync billing lead

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # verify starts a local database in Docker on the runner for db diff,
    # which takes a few minutes
    timeout-minutes: 30
    environment:
      name: production
    # The two secrets are not here: each step that runs the supabase command
    # gets them in its own env, so the actions that set up the runner and
    # npm run check-deploy never see them.
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STEP: ${{ inputs.step }}
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The same CLI the CI stack job tests the migrations and functions with.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: The settings are there and name the committed project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if ! printf '%s' "$PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$'; then echo "::error::the variable SUPABASE_PROJECT_REF is missing or is not a 20-character project ref"; exit 1; fi
          node -e "import('./extension/src/accountConfig.js').then(({ ACCOUNT }) => { const want = 'https://' + process.env.PROJECT_REF + '.supabase.co'; if (ACCOUNT.url.replace(/\/+\$/, '') !== want) { console.log('::error::extension/src/accountConfig.js names ' + (ACCOUNT.url || 'no project') + ', not ' + want + ': run npm run set-project and commit first'); process.exit(1); } })"
          if [ "$STEP" != check ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::the secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
          fi
          if [ "$STEP" = plan ] || [ "$STEP" = database ] || [ "$STEP" = functions ] || [ "$STEP" = verify ]; then
            if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::the secret SUPABASE_DB_PASSWORD is not set"; exit 1; fi
          fi
      - name: Link the project
        id: link
        if: inputs.step != 'check'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations db push would apply
        if: inputs.step == 'plan' || inputs.step == 'database'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run
      - name: Apply the migrations
        if: inputs.step == 'database'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes
      # Each name is checked against the four functions in supabase/functions,
      # so the box can only ever deploy one of them. Nothing deploys while
      # production has a migration to apply: a function may write the column
      # its migration adds (0009_cancel_at.sql and billing, for one), and
      # would fail until database has run.
      - name: Deploy the functions
        if: inputs.step == 'functions'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for f in $FUNCTIONS; do
            case "$f" in
              rewrite|sync|billing|lead) ;;
              *) echo "::error::$f is not one of rewrite, sync, billing, lead"; exit 1 ;;
            esac
          done
          supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/push-plan.txt"
          if ! grep -q 'Remote database is up to date' "$RUNNER_TEMP/push-plan.txt"; then
            echo "::error::production has not applied every migration in supabase/migrations, so nothing was deployed: run the database step first (verify says more when production has a migration the folder lacks)"
            exit 1
          fi
          for f in $FUNCTIONS; do supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api; done
      # verify: three read-only comparisons. Each prints what differs and
      # turns the run red; none of them writes to the project. Each runs once
      # the project is linked, even when an earlier comparison failed, so one
      # run reports every difference (pending migrations do not hide a schema
      # or function difference).
      - name: "verify: production has applied exactly the migrations in supabase/migrations"
        if: ${{ !cancelled() && inputs.step == 'verify' && steps.link.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase migration list --linked
          # a version production has and the folder lacks makes the dry run fail; one the folder has and production lacks is listed
          supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/push-plan.txt"
          if ! grep -q 'Remote database is up to date' "$RUNNER_TEMP/push-plan.txt"; then
            echo "::error::production has not applied every migration in supabase/migrations: db push would apply what is listed above"
            exit 1
          fi
      - name: "verify: production's public schema is the one the migrations build"
        if: ${{ !cancelled() && inputs.step == 'verify' && steps.link.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db diff --linked --schema public > "$RUNNER_TEMP/schema-diff.sql"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/schema-diff.sql"; then
            cat "$RUNNER_TEMP/schema-diff.sql"
            echo "::error::production's public schema differs from what supabase/migrations builds: the SQL above is the difference (a table, column, policy or function changed by hand)"
            exit 1
          fi
          echo "No difference in the public schema."
      # Each function is downloaded over its own folder in this throwaway
      # checkout and compared with git, then the checkout is put back, so one
      # function's copy of a _shared file never hides another's. --use-api
      # has the CLI unpack the source on Supabase's side and write each file
      # itself, as the runner's own user, beside the function's entrypoint
      # (../_shared lands in supabase/functions/_shared) and never outside
      # supabase/functions. Without it, on a runner with Docker, a container
      # writes the files as another user, and the line-ending fix and the
      # restore below fail on them before anything is compared. A folder the
      # download does not refill shows as deleted, so a download that lands
      # somewhere else fails rather than passes. Line endings are not
      # behaviour: a function deployed from a Windows checkout compares equal.
      - name: "verify: each deployed function's source is the one in supabase/functions"
        if: ${{ !cancelled() && inputs.step == 'verify' && steps.link.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          status=0
          for dir in supabase/functions/*/; do
            f=$(basename "$dir")
            if [ "$f" = _shared ]; then continue; fi
            rm -rf "supabase/functions/$f"
            supabase functions download "$f" --project-ref "$PROJECT_REF" --use-api
            find supabase/functions -type f -exec sed -i 's/\r$//' {} +
            if git diff --quiet -- supabase/functions; then
              echo "$f: the deployed source matches the repository"
            else
              echo "::error::$f: the deployed source differs from the repository (below: - is the repository, + is production)"
              git diff --stat -- supabase/functions
              git diff -- supabase/functions
              status=1
            fi
            extra=$(git ls-files --others --exclude-standard -- supabase/functions)
            if [ -n "$extra" ]; then
              echo "$f: the download also wrote files the repository does not have (not compared):"
              echo "$extra"
            fi
            git checkout -q -- supabase/functions
            git clean -fdq -- supabase/functions
          done
          exit "$status"
      # Before the functions are deployed (plan, database) some lines are
      # expected to fail: tables missing before the first push, sync and
      # rewrite missing before theirs. The output still shows, and the run
      # stays green; on functions, verify and check a FAIL turns the run red.
      - name: Check the project from the outside
        continue-on-error: ${{ inputs.step == 'plan' || inputs.step == 'database' }}
        run: npm run check-deploy
        env:
          LOTSYNC_MANAGER_ORIGIN: ${{ vars.MANAGER_URL }}
