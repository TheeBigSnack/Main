# Deploys the database and the Edge Functions to the production Supabase
# project, by hand only (Actions, Supabase, Run workflow): nothing here runs
# on a push. docs/production-setup.md, step 3, says when to run each step.
#
#   plan       links the project and shows which migrations db push would
#              apply (supabase db push --dry-run); changes nothing
#   database   applies them (supabase db push)
#   functions  deploys the functions named in the second box (default:
#              rewrite sync; billing and lead come later, supabase/README.md)
#   check      only the outside check (npm run check-deploy)
#
# Every step ends with npm run check-deploy against the project the
# committed config files name, and refuses to start when those files name a
# different project from SUPABASE_PROJECT_REF, so a deploy can only reach the
# project the extension and the manager view talk to.
#
# Settings it reads (Settings, Secrets and variables, Actions; the
# "production" environment can also require the owner's approval per run):
#   secrets  SUPABASE_ACCESS_TOKEN  a personal access token (supabase.com, Account, Access tokens)
#            SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   variable SUPABASE_PROJECT_REF   the 20-character ref in the project URL (not secret)
name: Supabase

on:
  workflow_dispatch:
    inputs:
      step:
        description: What to do
        type: choice
        options: [plan, database, functions, check]
        default: plan
      functions:
        description: Functions to deploy (functions step only)
        type: string
        default: rewrite sync

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STEP: ${{ inputs.step }}
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The same CLI the CI stack job tests the migrations and functions with.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: The settings are there and name the committed project
        run: |
          if ! printf '%s' "$PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$'; then echo "::error::the variable SUPABASE_PROJECT_REF is missing or is not a 20-character project ref"; exit 1; fi
          node -e "import('./extension/src/accountConfig.js').then(({ ACCOUNT }) => { const want = 'https://' + process.env.PROJECT_REF + '.supabase.co'; if (ACCOUNT.url.replace(/\/+\$/, '') !== want) { console.log('::error::extension/src/accountConfig.js names ' + (ACCOUNT.url || 'no project') + ', not ' + want + ': run npm run set-project and commit first'); process.exit(1); } })"
          if [ "$STEP" != check ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::the secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
          fi
          if [ "$STEP" = plan ] || [ "$STEP" = database ]; then
            if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::the secret SUPABASE_DB_PASSWORD is not set"; exit 1; fi
          fi
      - name: Link the project
        if: inputs.step != 'check'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations db push would apply
        if: inputs.step == 'plan' || inputs.step == 'database'
        run: supabase db push --dry-run
      - name: Apply the migrations
        if: inputs.step == 'database'
        run: supabase db push
      # Each name is checked against the four functions in supabase/functions,
      # so the box can only ever deploy one of them.
      - name: Deploy the functions
        if: inputs.step == 'functions'
        run: |
          for f in $FUNCTIONS; do
            case "$f" in
              rewrite|sync|billing|lead) ;;
              *) echo "::error::$f is not one of rewrite, sync, billing, lead"; exit 1 ;;
            esac
          done
          for f in $FUNCTIONS; do supabase functions deploy "$f" --project-ref "$PROJECT_REF"; done
      - name: Check the project from the outside
        run: npm run check-deploy
