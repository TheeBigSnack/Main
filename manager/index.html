<!doctype html>
<!--
  Lot Current manager view (Milestone 4): who posted what, sold cars still
  listed and for how long, price changes not yet updated; and, from
  Milestone 5, the Billing card (the free pilot, Subscribe and Manage
  billing through Stripe) and, for managers, the Invite codes card (Invite
  a salesperson, Invite a manager) and the Getting started card. Once the
  owner opens self-serve sign-up, a signed-in person in no dealership gets
  the Start your dealership form. Plain HTML, CSS and ES modules; every path is
  relative, so the folder can be hosted as static files or opened straight
  from disk.

  Not set up yet? Open index.html?mock=1 (or click "Try with sample data") for
  a made-up dealership, or index.html?mock=signup for the Start your
  dealership form, which lands in a new, empty sample dealership. Neither
  touches the network. Chrome and Safari refuse to load ES modules from a
  file:// address, so for the sample data on disk either open the file in
  Firefox or run `node manager/serve.mjs` and open the address it prints.
  The live data needs manager/config.js filled in (see the comment there).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Scripts only from this folder (supabase-js included: manager/vendor/); calls only to this origin and Supabase.
       Add a functionsUrl host to connect-src if config.js sets one. manager/_headers carries the same policy. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Lot Current manager view</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 class="title">Lot Current</h1>
      <div class="site" id="dealer">Manager view</div>
    </div>
    <div class="top-actions" id="actions"></div>
  </header>
  <div class="status" id="status" role="status"></div>
  <main class="wrap" id="main">
    <p class="empty">Loading…</p>
    <noscript><p class="empty">This page needs JavaScript.</p></noscript>
  </main>
  <footer class="foot">Lot Current is not affiliated with Meta Platforms, Inc. "Facebook" and "Marketplace" are used only as the names of the places salespeople post.</footer>
  <script type="module" src="manager.js"></script>
</body>
</html>
